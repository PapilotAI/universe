[setup]
notes = "metacapture.sty (CTAN 0.9.2, LPPL 1.3c) is bundled because TeX Live 2025 does not ship it. Pick the journal with \\documentclass[journal=tosc,version=submission]{iacrj} (or journal=tches); use version=final for the camera-ready."
