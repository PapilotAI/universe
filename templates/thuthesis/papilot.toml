id = "thuthesis"
version = "7.7.1"
name = "Tsinghua University Thesis"
description = "ThuThesis, the widely used thesis template for Tsinghua University: bachelor, master, doctoral and postdoctoral theses."
category = "thesis"
tags = ["thesis", "tsinghua", "ctex", "中文", "清华"]
