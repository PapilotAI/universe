main = "thuthesis-example.tex"
engine = "xelatex"
organization = "Tsinghua University"

[upstream]
url = "https://github.com/tuna/thuthesis/releases/download/v7.7.1/thuthesis-v7.7.1.zip"
homepage = "https://github.com/tuna/thuthesis"
version = "v7.7.1"
