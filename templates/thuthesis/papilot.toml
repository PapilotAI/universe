[zh-CN]
name = "清华大学学位论文"
description = "清华大学学位论文模板 ThuThesis，支持本科、硕士、博士及博士后。"

[setup]
notes = "Choose the degree in \\documentclass[degree=...] of thuthesis-example.tex (doctor, master, bachelor or postdoc; add degree-type=professional or language=english as needed). The title, author, department, supervisor and dates go in thusetup.tex; chapters, abstract, committee and resume are in data/, references in ref/refs.bib (BibTeX)."
