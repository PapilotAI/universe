[setup]
notes = "Pick the style and color with \\moderncvstyle and \\moderncvcolor near the top of template.tex. moderncv 2.6.1 is bundled because the sample uses commands older TeX Live releases lack; its icons need the fontawesome6 package (TeX Live 2026 or newer)."
